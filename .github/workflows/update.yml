name: 毎朝の商品データ更新

on:
  schedule:
    - cron: "0 20 * * *"   # 毎朝 5:00（日本時間）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 商品データを取り直す
        run: python3 scripts/build.py
      - name: 色を決める（失敗してもデータは出す）
        continue-on-error: true
        run: |
          python3 -m pip install pillow
          python3 scripts/colors.py --minutes 40
      - name: 変わっていればコミット（Vercel が自動で公開し直す）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "商品データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
            # 実行中に別のコミットが入っていても push できるようにする
            git pull --rebase
            git push
          fi
